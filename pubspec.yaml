name: script_browser
description: Android browser with GitHub JavaScript scripts.
publish_to: none
version: 1.7.2+18
environment:
  sdk: '>=3.10.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  # The beta includes the ProGuard configuration fix required by AGP 9.
  flutter_inappwebview: 6.2.0-beta.3
  flutter_secure_storage: ^11.2.0
  shared_preferences: ^2.5.3
  xml: ^7.1.0
dev_dependencies:
  integration_test:
    sdk: flutter
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/vendor/hls-1.7.3.min.js
